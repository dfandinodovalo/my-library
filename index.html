<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi biblioteca</title>
  <meta name="description" content="Catálogo personal de libros leídos, con portadas extraídas de los EPUB.">
  <meta name="color-scheme" content="dark light">
  <!-- Un color por esquema: pinta la barra de estado del móvil a juego con la
       app en vez de dejar un corte de color al abrirla instalada. -->
  <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1714" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS respeta el manifest desde la 16.4, pero estas dos siguen haciendo
       falta para que en versiones anteriores abra sin barra de navegador. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Puerta de entrada estilo Netflix. Va oculta y solo se muestra cuando no hay
     perfil recordado en este dispositivo, o cuando se pide cambiar de perfil. -->
<section class="gate" id="gate" hidden>
  <div class="gate-inner">
    <h2 class="gate-title">¿Quién está leyendo?</h2>
    <div class="gate-profiles" id="gate-profiles"></div>
    <div class="gate-actions">
      <button type="button" class="btn btn-ghost" data-action="profiles">Gestionar perfiles</button>
      <button type="button" class="btn btn-ghost" id="gate-cancel" hidden>Cancelar</button>
    </div>
  </div>
</section>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">📚</span>
    <h1>Mi biblioteca</h1>
  </div>

  <div class="topbar-actions">
    <button type="button" class="sync-button" id="sync" hidden></button>
    <button type="button" class="profile-current" id="profile-current" title="Cambiar de perfil"></button>
    <button type="button" class="btn btn-icon" id="menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Más opciones">⋯</button>
  </div>
</header>

<!-- Fuera de <header> a propósito: la topbar lleva backdrop-filter, y eso crea
     un containing block que rompe el position:fixed de sus descendientes. -->
<div class="menu-panel" id="menu-panel" hidden>
  <div class="menu-head">
    <h2>Opciones</h2>
    <button type="button" class="btn btn-icon" id="menu-close" aria-label="Cerrar">✕</button>
  </div>
  <button type="button" data-action="switch">Cambiar de perfil</button>
  <button type="button" data-action="profiles">Gestionar perfiles</button>
  <hr>
  <button type="button" data-action="sync-settings">Sincronización con GitHub</button>
  <hr>
  <button type="button" data-action="export">Exportar copia de seguridad</button>
  <button type="button" data-action="import">Importar copia de seguridad</button>
  <hr>
  <button type="button" data-action="theme">Cambiar tema</button>
  <button type="button" data-action="storage">Espacio usado</button>
</div>

<section class="stats" id="stats" aria-label="Resumen"></section>

<section class="toolbar">
  <div class="search">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input type="search" id="search" placeholder="Buscar título, autor, saga…" autocomplete="off" aria-label="Buscar">
  </div>

  <!-- En móvil los filtros viven en una hoja inferior; en escritorio, en línea -->
  <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false">
    <span aria-hidden="true">⚙</span> Filtros<span class="filters-count" id="filters-count" hidden></span>
  </button>

  <div class="filters" id="filters">
    <div class="filters-head">
      <h2>Filtros y orden</h2>
      <button type="button" class="btn btn-icon" id="filters-close" aria-label="Cerrar filtros">✕</button>
    </div>

    <label class="filter-field">
      <span>Estado</span>
      <select id="filter-status" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option>
      </select>
    </label>

    <label class="filter-field">
      <span>Puntuación</span>
      <select id="filter-rating" aria-label="Filtrar por puntuación">
        <option value="0">Cualquier nota</option>
        <option value="5">5 estrellas</option>
        <option value="4">4+ estrellas</option>
        <option value="3">3+ estrellas</option>
      </select>
    </label>

    <label class="filter-field">
      <span>Año de lectura</span>
      <select id="filter-year" aria-label="Filtrar por año de lectura">
        <option value="">Cualquier año</option>
      </select>
    </label>

    <label class="filter-field">
      <span>Ordenar por</span>
      <select id="sort" aria-label="Ordenar por"></select>
    </label>

    <div class="filter-field">
      <span>Vista</span>
      <div class="view-toggle" role="group" aria-label="Vista">
        <button type="button" data-view="grid" class="is-active" aria-label="Vista de portadas">▦</button>
        <button type="button" data-view="list" aria-label="Vista de lista">☰</button>
      </div>
    </div>

    <div class="filters-foot">
      <button type="button" class="btn btn-ghost" data-action="clear-filters">Quitar filtros</button>
      <button type="button" class="btn btn-primary" id="filters-apply">Ver resultados</button>
    </div>
  </div>
</section>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

<!-- Pestañas de ámbito: solo aparecen cuando hay más de una biblioteca que ver -->
<nav class="scopes" id="scopes" aria-label="Qué biblioteca ver" hidden></nav>

<main id="library" class="library view-grid" aria-live="polite"></main>

<div class="empty" id="empty" hidden></div>

<!-- Entradas de fichero ocultas; se disparan desde los botones -->
<input type="file" id="epub-input" accept=".epub,application/epub+zip" multiple hidden>
<input type="file" id="backup-input" accept=".json,application/json" hidden>

<!-- Overlay de arrastrar y soltar sobre toda la ventana -->
<div class="dropzone" id="dropzone" hidden>
  <div class="dropzone-inner">
    <span aria-hidden="true">📖</span>
    <p>Suelta aquí tus EPUB</p>
  </div>
</div>

<!-- Añadir libro: siempre al alcance del pulgar, con las dos vías separadas -->
<div class="fab" id="fab">
  <div class="fab-actions" id="fab-actions" hidden>
    <button type="button" data-action="add-epub">
      <span class="fab-icon" aria-hidden="true">📕</span>
      <span><strong>Subir EPUB</strong><small>Saco portada y datos del fichero</small></span>
    </button>
    <button type="button" data-action="add-manual">
      <span class="fab-icon" aria-hidden="true">✏️</span>
      <span><strong>Añadir a mano</strong><small>Para los que no tienes en EPUB</small></span>
    </button>
  </div>
  <button type="button" class="fab-main" id="fab-main" aria-expanded="false" aria-label="Añadir libro">
    <span aria-hidden="true">＋</span>
  </button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="book-dialog" class="dialog dialog-book"></dialog>
<dialog id="profiles-dialog" class="dialog dialog-profiles"></dialog>
<dialog id="sync-dialog" class="dialog dialog-sync"></dialog>

<noscript>
  <p style="padding:2rem;text-align:center">Esta página necesita JavaScript para leer tus EPUB.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
